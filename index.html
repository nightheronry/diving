<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230b4f6c'/%3E%3Cpath d='M12 36c6-6 14-6 20 0s14 6 20 0' stroke='%2388e5ff' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#01111c" />
    <title>Realistic Diving Simulation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app">
      <div id="canvas-container"></div>
      <div id="ui-container">
        <div class="crosshair"></div>
        <div id="touch-reticle" class="touch-reticle" aria-hidden="true">
          <div class="touch-reticle-ring"></div>
          <div class="touch-reticle-dot"></div>
        </div>
        <div class="hud-telemetry">
          <div class="hud-badge"><span class="hud-label">DEPTH</span> <span id="depth-val">15.6 m</span></div>
          <div class="hud-badge"><span class="hud-label">ZONE</span> <span id="zone-val">Coral Canyon</span></div>
          <button id="audio-btn" class="hud-badge audio-btn" type="button" title="Toggle Audio / Mute (Key M)">
            <span class="hud-label">AUDIO</span> <span id="audio-val">🔊 水下 · 🐋 鯨鳴</span>
          </button>
        </div>
        <div class="instructions" id="hud-help">
          <h1>ABYSSAL REEF · WHALES & SHARK</h1>
          <p class="kbd-hint">Click scene to lock pointer (or drag to look) · M Mute · H Hide HUD</p>
          <p class="kbd-hint">W A S D Swim · Space / E Ascend · Shift / Q Dive · 1–6 Vistas</p>
          <p class="touch-hint">按住螢幕前進 · 滑動轉向 · 第二指加速</p>
          <p class="touch-hint">Hold to swim · slide to steer · 2nd finger = faster · tap = ripple / sand</p>
        </div>
        <div class="viewpoint-bar">
          <button class="vp-btn" data-vp="0">1 · Canyon & Whales</button>
          <button class="vp-btn" data-vp="1">2 · Whale Fluke</button>
          <button class="vp-btn" data-vp="2">3 · Shipwreck</button>
          <button class="vp-btn" data-vp="3">4 · Sponge Canyon</button>
          <button class="vp-btn" data-vp="4">5 · Purple Grotto</button>
          <button class="vp-btn" data-vp="5">6 · Surface</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
